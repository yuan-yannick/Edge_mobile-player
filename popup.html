<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>长按加速播放 - 设置</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" class="logo" />
    <div>
      <h1>长按加速播放</h1>
      <p class="sub">长按视频临时加速 · 松手恢复原速</p>
    </div>
  </header>

  <main>
    <label class="row switch">
      <span>启用功能</span>
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>

    <div class="row">
      <div class="row-head">
        <label for="speed">长按倍速</label>
        <span class="val" id="speedVal">3.0x</span>
      </div>
      <input type="range" id="speed" min="1.25" max="5" step="0.25" />
    </div>

    <div class="row">
      <div class="row-head">
        <label for="delay">长按触发延时</label>
        <span class="val" id="delayVal">350ms</span>
      </div>
      <input type="range" id="delay" min="150" max="800" step="50" />
    </div>

    <label class="row switch">
      <span>激活时震动反馈</span>
      <input type="checkbox" id="vibrate" />
      <span class="slider"></span>
    </label>
  </main>

  <footer>
    <span id="tip" class="tip"></span>
    <a id="howto" href="#">使用说明</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
